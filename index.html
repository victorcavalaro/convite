<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Formatura — Julia Ribeiro</title><link rel="stylesheet" href="style.css"><script src="config.js" defer></script><script src="main.js" defer></script></head><body>
<nav class="mini-timeline" aria-label="Páginas do convite"><div class="timeline-line-mini"></div>
<button class="timeline-dot-mini" data-target="hero" aria-label="Seja bem vindo"><span>Seja bem vindo</span></button>
<button class="timeline-dot-mini" data-target="memory1" aria-label="convite"><span>convite</span></button>
<button class="timeline-dot-mini" data-target="location" aria-label="localização"><span>localização</span></button>
<button class="timeline-dot-mini" data-target="confirmation" aria-label="confirmação"><span>confirmação</span></button>
</nav><main>
<section class="page hero" id="hero" aria-label="Seja bem vindo">
<picture><source media="(min-aspect-ratio: 1/1)" srcset="img/1d.jpg"><img class="page-art hero-cover" src="img/1p.jpg" alt="Seja bem vindo — Julia Ribeiro" fetchpriority="high"></picture>
<button id="scrollDown" class="scroll-down" aria-label="Abrir convite">⌄</button>
</section>
<section class="page " id="memory1" aria-label="convite">
<picture><source media="(min-aspect-ratio: 1/1)" srcset="img/2.jpg"><img class="page-art " src="img/2p.jpg" alt="convite — Julia Ribeiro" fetchpriority="high"></picture>
</section>
<section class="page " id="location" aria-label="localização">
<picture><source media="(min-aspect-ratio: 1/1)" srcset="img/3d.jpg"><img class="page-art " src="img/3p.jpg" alt="localização — Julia Ribeiro" ></picture>
<div class="map-box" id="mapBox"><p id="mapPlaceholder">Localização em breve</p><iframe id="mapFrame" title="Local da formatura no Google Maps" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen hidden></iframe></div>
</section>
<section class="page " id="confirmation" aria-label="confirmação">
<picture><source media="(min-aspect-ratio: 1/1)" srcset="img/4d.jpg"><img class="page-art " src="img/4p.jpg" alt="confirmação — Julia Ribeiro" ></picture>
<a id="confirmButton" class="confirm-button" role="link" tabindex="0" aria-label="Confirmar presença pelo WhatsApp" aria-disabled="true" target="_blank" rel="noopener noreferrer"></a><p id="confirmStatus" class="confirm-status" role="status"></p>
</section>
</main></body></html>
